name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm --prefix frontend-v2 ci
      - run: npm run ci
      - run: npm --prefix frontend-v2 run ci
      - run: npm audit --omit=dev
      - run: npm --prefix frontend-v2 audit --omit=dev
